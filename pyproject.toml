[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanbai"
version = "0.1.0"
description = "A file-based Kanban board for Claude Code and other AI coding harnesses"
authors = [
    {name = "Rennan Cockles", email = "rennan.cockles@experian.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["kanban", "claude", "claude-code", "ai", "agent", "task-management"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx2>=2.13",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "watchfiles>=0.21",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "ty>=0.0.75",
    "pytest>=9.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.6",
    "pytest-xdist>=3.8.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
kanbai = "kanbai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["kanbai"]
# Ship the web UI's Jinja2 templates and static assets (CSS, vendored htmx) in the wheel.
artifacts = [
    "kanbai/web/templates/**/*.html",
    "kanbai/web/static/**/*",
]


[tool.ruff]
line-length = 100
src = ["kanbai", "tests"]
indent-width = 4
respect-gitignore = true
target-version = "py310"

[tool.ruff.lint]
select = [
    "C",  # McCabe complexity
    "E",  # pycodestyle
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "PL",  # Pylint
    "B",  # flake8-bugbear
    "ASYNC",  # flake8-async
    "SIM",  # flake8-simplify
    "N",  # pep8-naming
]
ignore = [
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Imported but unused
"tests/**/*" = [
    "PLR2004",  # Magic value used in comparison
    "SIM300",  # Yoda conditions are discouraged
]
"kanbai/cli.py" = [
    "B008",  # Typer's idiom is to call Option()/Argument() in parameter defaults.
    "PLR0913",  # CLI commands legitimately expose many options.
    "PLR0917",
]
"kanbai/web/app.py" = ["B008"]  # FastAPI's idiom is to call Form()/Depends() in defaults.

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
# known-first-party = ["app", "tests"]
# extra-standard-library = ["typing_extensions"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kanbai"]
cache_fine_grained = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true
plugins = [
    "pydantic.mypy",
]


[tool.ty.src]
include = ["kanbai"]

[tool.ty.rules]
unused-ignore-comment = "ignore"
no-matching-overload = "ignore"
unused-type-ignore-comment = "ignore"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.terminal]
output-format = "concise"


[tool.pytest.ini_options]
addopts = "-rfEs --strict-config --strict-markers -n auto --no-header"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
    "tests",
]
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test"
]


[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 75
