<div class="modal-overlay" onclick="if(event.target===this)this.parentElement.innerHTML=''">
  <form class="modal card" hx-post="{{ base }}/sprint/plan" hx-target="#board" hx-swap="outerHTML"
        hx-on::after-request="if(event.detail.successful) document.getElementById('detail').innerHTML=''">
    <div class="modal-head">
      <span class="card-id">Plan sprint</span>
      <span class="card-pri">backlog → {{ sprint }}</span>
      <button class="modal-close" type="button" aria-label="Close"
              onclick="document.getElementById('detail').innerHTML=''">✕</button>
    </div>

    {% if cards %}
    <input class="modal-search" type="search" placeholder="Filter cards…" autocomplete="off"
           oninput="kanbaiFilterModal(this)">
    <div class="plan-list">
      {% for card in cards %}
      <label class="plan-item">
        <input type="checkbox" name="ids" value="{{ card.id }}">
        <span class="card-id">#{{ card.id }}</span>
        <span class="plan-title">{{ card.title }}</span>
        <span class="card-pri {{ priority_class[card.priority.value] }}">{{ card.priority.value }}</span>
      </label>
      {% endfor %}
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-ghost"
              onclick="document.getElementById('detail').innerHTML=''">Cancel</button>
      <button type="submit" class="btn-primary">Move to sprint</button>
    </div>
    {% else %}
    <p class="empty">The backlog is empty</p>
    {% endif %}
  </form>
</div>
