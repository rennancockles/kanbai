<div class="modal-overlay" onclick="if(event.target===this)this.parentElement.innerHTML=''">
  <div class="modal card">
    <div class="modal-head">
      <span class="card-id">Archive</span>
      <span class="card-pri">{{ cards | length }} card(s)</span>
      <button class="modal-close" type="button" aria-label="Close"
              onclick="document.getElementById('detail').innerHTML=''">✕</button>
    </div>

    {% if cards %}
    <div class="plan-list">
      {% for card in cards %}
      <div class="archive-item">
        <span class="card-id">#{{ card.id }}</span>
        <span class="plan-title">{{ card.title }}</span>
        <span class="archive-from">from {{ card.archived_from or '—' }}</span>
        <button class="btn-ghost" type="button"
                hx-post="/cards/{{ card.id }}/restore" hx-target="#board" hx-swap="outerHTML"
                hx-on::after-request="if(event.detail.successful) document.getElementById('detail').innerHTML=''">
          Restore
        </button>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <p class="empty">The archive is empty</p>
    {% endif %}
  </div>
</div>
