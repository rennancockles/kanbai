<div class="board" id="board-{{ board_name }}" data-board-name="{{ board_name }}">
  {% for column in columns %}
  <section class="column{% if column.name == backlog_column %} is-backlog{% endif %}"
           data-column="{{ column.name }}">
    <div class="column-head">
      <h2 class="column-title">{{ column.name }}</h2>
      {% if column.blocks %}
      <span class="group-actions">
        <button type="button" class="group-action" data-group-action="collapse"
                title="Collapse all groups" aria-label="Collapse all groups">&#x25B8;</button>
        <button type="button" class="group-action" data-group-action="expand"
                title="Expand all groups" aria-label="Expand all groups">&#x25BE;</button>
      </span>
      {% endif %}
      <span class="count{% if column.over %} over{% endif %}"
            {% if column.limit %}title="WIP limit {{ column.limit }}"{% endif %}>
        {{ column.cards | length }}{% if column.limit %}/{{ column.limit }}{% endif %}</span>
    </div>
    <div class="cards" data-column="{{ column.name }}"{% if column.name == backlog_column %} data-backlog="1"{% endif %}{% if column.blocks %} data-grouped="1"{% endif %}>
      {% include "_column_cards.html" %}
    </div>
  </section>
  {% endfor %}
</div>
