<div class="modal-overlay" onclick="if(event.target===this)this.parentElement.innerHTML=''">
  <div class="modal card">
    <div class="modal-head">
      <span class="card-id">AI command</span>
      <button class="modal-close" type="button" aria-label="Close"
              onclick="document.getElementById('detail').innerHTML=''">✕</button>
    </div>
    <p class="modal-alert">
      Couldn't understand that instruction — try rephrasing, or use "New card" instead.
    </p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost"
              onclick="document.getElementById('detail').innerHTML=''">Close</button>
    </div>
  </div>
</div>
