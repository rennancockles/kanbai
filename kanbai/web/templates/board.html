<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ board_name }} · {{ app_name }}</title>
  <link rel="icon" type="image/png" href="{{ base }}/static/icon.png">
  <link rel="apple-touch-icon" href="{{ base }}/static/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ base }}/static/style.css">
  <script src="{{ base }}/static/htmx.min.js"></script>
  <script src="{{ base }}/static/Sortable.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img class="logo" src="{{ base }}/static/icon.png" alt="{{ app_name }}" width="38" height="38">
      <h1 title="{{ app_name }} v{{ app_version }}">{{ app_name }}{% if boards %} <span class="hub-tag">hub</span>{% endif %}</h1>
      {% if boards %}
      <select class="board-switcher" aria-label="Switch board"
              onchange="if(this.value)location.href=this.value">
        {% for b in boards %}
        <option value="{{ b.url }}"{% if b.name == current %} selected{% endif %}>{{ b.name }}</option>
        {% endfor %}
      </select>
      {% else %}
      <span class="board-switcher board-switcher-static">{{ board_name }}</span>
      {% endif %}
    </div>
    <div class="board-actions">
      <button class="icon-btn" type="button" title="Add a new card"
              hx-get="{{ base }}/cards/new" hx-target="#detail" hx-swap="innerHTML">
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New card</span>
      </button>
      <button class="icon-btn" type="button" title="Plan the sprint from the backlog"
              hx-get="{{ base }}/sprint/plan" hx-target="#detail" hx-swap="innerHTML">
        <svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span>Plan sprint</span>
      </button>
      <button class="icon-btn" type="button" title="Close the current sprint and start a new one"
              hx-get="{{ base }}/sprint/new" hx-target="#detail" hx-swap="innerHTML">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
        <span>Close sprint</span>
      </button>
      <button class="icon-btn" type="button" title="Browse archived cards"
              hx-get="{{ base }}/archive" hx-target="#detail" hx-swap="innerHTML">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        <span>Archive</span>
      </button>
      {% if backlog_column in column_names %}
      <button class="icon-btn" id="toggle-backlog" type="button" aria-pressed="false"
              title="Show or hide the backlog column">
        <svg class="icon icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <span>Backlog</span>
      </button>
      {% endif %}
    </div>
  </header>

  <div class="toolbar">
    <input class="search" type="search" name="q" placeholder="Search cards…" autocomplete="off"
           value="{{ search }}"
           hx-get="{{ base }}/board" hx-target="#board" hx-swap="outerHTML"
           hx-trigger="input changed delay:250ms, search"
           hx-include="[name='label'], .type-filter">
    <select class="label-filter" name="label" aria-label="Filter by label"
            hx-get="{{ base }}/board" hx-target="#board" hx-swap="outerHTML"
            hx-trigger="change" hx-include="[name='q'], .type-filter">
      <option value="">All labels</option>
      {% for lb in labels %}
      <option value="{{ lb }}"{% if lb == label %} selected{% endif %}>{{ lb }}</option>
      {% endfor %}
    </select>
    {% if types %}
    <select class="type-filter" name="type" aria-label="Filter by type"
            hx-get="{{ base }}/board" hx-target="#board" hx-swap="outerHTML"
            hx-trigger="change" hx-include="[name='q'], [name='label']">
      <option value="">All types</option>
      {% for t in types %}
      <option value="{{ t }}"{% if t == type %} selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
    {% endif %}
  </div>

  {% include "_board.html" %}

  <!-- Card detail modal target (populated by HTMX when a card is clicked). -->
  <div id="detail"></div>

  <script>
    var BASE = "{{ base }}";

    // Drag-and-drop between columns; persist each move via HTMX, then swap in the
    // server-rendered board so the UI always matches the .kanbai/ files.
    function initSortables() {
      document.querySelectorAll('.cards').forEach(function (el) {
        if (el._sortable) return;
        el._sortable = Sortable.create(el, {
          group: 'kanbai',
          animation: 150,
          draggable: '.card',        // ignore the "empty" placeholder in index math
          ghostClass: 'card-ghost',
          onEnd: function (evt) {
            var id = evt.item.getAttribute('data-id');
            var column = evt.to.getAttribute('data-column');
            if (!id || !column) return;
            htmx.ajax('POST', BASE + '/cards/' + id + '/move', {
              target: '#board', swap: 'outerHTML',
              values: { column: column, position: evt.newIndex }
            });
          }
        });
      });
    }
    document.addEventListener('DOMContentLoaded', initSortables);
    document.body.addEventListener('htmx:afterSwap', initSortables);

    // Live updates: when .kanbai/ changes on disk (e.g. Claude moves a card via the CLI),
    // the server pushes an SSE event and we re-fetch just the board.
    if (window.EventSource) {
      var events = new EventSource(BASE + '/events');
      events.onmessage = function () {
        // Carry the current search/label/type so a live refresh keeps the active filter.
        var q = document.querySelector('[name=q]');
        var label = document.querySelector('[name=label]');
        var type = document.querySelector('.type-filter');
        htmx.ajax('GET', BASE + '/board', {
          target: '#board', swap: 'outerHTML',
          values: { q: q ? q.value : '', label: label ? label.value : '', type: type ? type.value : '' }
        });
      };
    }

    // Hide/show the backlog column to free space for the sprint. Purely client-side:
    // toggles a class on <body> (survives board re-renders) and remembers it per browser.
    (function () {
      var btn = document.getElementById('toggle-backlog');
      if (!btn) return;
      var KEY = 'kanbai:hide-backlog';
      function apply(hidden) {
        document.body.classList.toggle('hide-backlog', hidden);
        btn.setAttribute('aria-pressed', hidden ? 'true' : 'false');
      }
      apply(localStorage.getItem(KEY) === '1');
      btn.addEventListener('click', function () {
        var hidden = !document.body.classList.contains('hide-backlog');
        localStorage.setItem(KEY, hidden ? '1' : '0');
        apply(hidden);
      });
    })();

    // Close any open modal (detail / edit / plan) with the Escape key.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') kanbaiCloseDetail();
    });

    // Opening a card from the archive list remembers that modal (and its scroll
    // position) so closing the card goes back to the archive instead of clearing
    // everything. Any other request that replaces #detail invalidates the saved
    // snapshot, so a stale archive list is never restored later (e.g. via Escape).
    document.body.addEventListener('htmx:beforeRequest', function (e) {
      var elt = e.detail.elt;
      var detail = document.getElementById('detail');
      if (elt && elt.classList && elt.classList.contains('archive-item')) {
        var list = detail.querySelector('.plan-list');
        window.__kanbaiArchiveReturn = { html: detail.innerHTML, scrollTop: list ? list.scrollTop : 0 };
      } else if (e.detail.target === detail) {
        window.__kanbaiArchiveReturn = null;
      }
    });

    // Close the card detail: back to the remembered archive list if there is one
    // (restoring its scroll position), otherwise clear the modal entirely.
    function kanbaiCloseDetail() {
      var detail = document.getElementById('detail');
      var saved = window.__kanbaiArchiveReturn;
      if (saved) {
        window.__kanbaiArchiveReturn = null;
        detail.innerHTML = saved.html;
        htmx.process(detail);
        var list = detail.querySelector('.plan-list');
        if (list) list.scrollTop = saved.scrollTop;
      } else {
        detail.innerHTML = '';
      }
    }

    // Fully clear the card detail after an action that changes the card (move,
    // delete, archive, restore) — never restore a now-stale archive list.
    function kanbaiClearDetail() {
      window.__kanbaiArchiveReturn = null;
      document.getElementById('detail').innerHTML = '';
    }

    // Filter the items in a modal list (Plan sprint / Archive) client-side, so checkbox
    // selections are preserved across filtering — just hide the rows that don't match.
    function kanbaiFilterModal(input) {
      var query = input.value.trim().toLowerCase();
      var list = input.closest('.modal').querySelector('.plan-list');
      if (!list) return;
      list.querySelectorAll('.plan-item, .archive-item').forEach(function (item) {
        item.style.display = item.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
