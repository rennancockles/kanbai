<div class="modal-overlay" onclick="if(event.target===this)this.parentElement.innerHTML=''">
  <form class="modal card" hx-post="{{ base }}/cards" hx-target="#board" hx-swap="outerHTML"
        hx-on::after-request="if(event.detail.successful) document.getElementById('detail').innerHTML=''">
    <div class="modal-head">
      <span class="card-id">New card</span>
      <button class="modal-close" type="button" aria-label="Close"
              onclick="document.getElementById('detail').innerHTML=''">✕</button>
    </div>

    <label class="field">
      <span>Title</span>
      <input type="text" name="title" placeholder="Card title…" required autocomplete="off" autofocus>
    </label>
    <label class="field">
      <span>Column</span>
      <select name="column">
        {% for name in column_names %}
        <option value="{{ name }}"{% if name == default_column %} selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span>Priority</span>
      <select name="priority">
        {% for p in priorities %}
        <option value="{{ p }}"{% if p == 'medium' %} selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span>Type</span>
      <select name="type">
        <option value="" selected>—</option>
        {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
    </label>
    <label class="field">
      <span>Labels</span>
      <input type="text" name="labels" placeholder="comma, separated" autocomplete="off">
    </label>
    <label class="field">
      <span>Description</span>
      <textarea name="description" rows="8"></textarea>
    </label>

    <div class="modal-actions">
      <button type="button" class="btn-ghost"
              onclick="document.getElementById('detail').innerHTML=''">Cancel</button>
      <button type="submit" class="btn-primary">Add card</button>
    </div>
  </form>
</div>
